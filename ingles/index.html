<title>English A1+ Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: wizard a pantalla completa. Home = rejilla de temas con scroll propio;
     cada tema = explicación paso a paso + examen de 15 preguntas elegidas al azar
     de un banco de 30. Barra de progreso arriba, navegación Atrás/Siguiente abajo. */
  :root {
    --bg: #fbf7f0; --surface: #ffffff; --surface-2: #f4eee3; --fg: #2b2a26; --muted: #726d63; --border: #e7ddcd;
    --primary: #2f6d63; --primary-soft: #dcefe9; --accent: #e8743b; --accent-soft: #fbe6d8;
    --good: #2e7d4f; --good-soft: #dcf0e2; --bad: #c23c3c; --bad-soft: #f8e0dd;
    --shadow: 0 2px 4px rgba(40,30,15,.05), 0 8px 24px rgba(40,30,15,.06);
    --radius: 16px; --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif; --font-body: "Nunito", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1916; --surface: #262420; --surface-2: #2f2c27; --fg: #f1ece2; --muted: #aba497; --border: #3a362f;
      --primary: #6fc3b4; --primary-soft: #223f3a; --accent: #f08a56; --accent-soft: #3d2a1e;
      --good: #6cc48b; --good-soft: #223a2b; --bad: #ec7b7b; --bad-soft: #3d2322;
      --shadow: 0 2px 4px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1916; --surface: #262420; --surface-2: #2f2c27; --fg: #f1ece2; --muted: #aba497; --border: #3a362f;
    --primary: #6fc3b4; --primary-soft: #223f3a; --accent: #f08a56; --accent-soft: #3d2a1e;
    --good: #6cc48b; --good-soft: #223a2b; --bad: #ec7b7b; --bad-soft: #3d2322;
    --shadow: 0 2px 4px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); line-height: 1.55; display: flex; flex-direction: column; overflow: hidden; }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; letter-spacing: -.01em; }
  a { color: var(--primary); }

  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); }
  header.bar {
    flex: none; background: var(--surface); border-bottom: 1px solid var(--border);
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
    padding-block: 9px; display: flex; align-items: center; gap: 10px;
  }
  .bar .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; cursor: pointer; background: none; border: 0; color: var(--fg); padding: 4px 6px; border-radius: 10px; }
  .bar .brand:hover { background: var(--surface-2); }
  .bar .logo { width: 29px; height: 29px; border-radius: 9px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: .95rem; flex: none; }
  .bar .spacer { flex: 1; }
  .icon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--fg); width: 37px; height: 37px; border-radius: 10px; font-size: 1rem; cursor: pointer; display: grid; place-items: center; flex: none; }
  .icon-btn:hover { border-color: var(--primary); }

  main { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; }
  .wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 48px; }

  .hero { margin-bottom: 20px; }
  .hero .eyebrow { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .72rem; }
  .hero h1 { font-size: clamp(1.7rem, 6vw, 2.4rem); margin: 4px 0 8px; }
  .hero p { color: var(--muted); max-width: 60ch; margin: 0; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; box-shadow: var(--shadow); color: var(--fg); display: flex; flex-direction: column; gap: 6px; transition: transform .15s ease, border-color .15s ease; min-width: 0; }
  .card:hover { transform: translateY(-3px); border-color: var(--primary); }
  .card .emoji { font-size: 1.7rem; }
  .card .t-en { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
  .card .t-es { color: var(--muted); font-size: .9rem; }
  .card .foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .pill.done { background: var(--good-soft); color: var(--good); }
  .pill.n { background: var(--primary-soft); color: var(--primary); }
  .mural-h { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; color: var(--fg); }
  .mural-h:first-of-type { margin-top: 6px; }
  .mural-h.hdone { color: var(--muted); }
  .mural-h .count { font-size: .76rem; font-weight: 800; background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 2px 9px; }

  /* ---------- WIZARD ---------- */
  .wizard { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .wiz-top { flex: none; border-bottom: 1px solid var(--border); background: var(--surface); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
  .wiz-top .row { display: flex; align-items: center; gap: 10px; }
  .wiz-close { background: none; border: 0; color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 8px; flex: none; }
  .wiz-close:hover { background: var(--surface-2); color: var(--fg); }
  .wiz-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .wiz-title .em { font-size: 1.15rem; }
  .wiz-title .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wiz-step { margin-left: auto; color: var(--muted); font-size: .82rem; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
  .pbar { height: 6px; border-radius: 999px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
  .pbar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }

  .slide-area { flex: 1; min-height: 0; overflow-y: auto; }
  .slide-wrap { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-block: 22px; }
  .slide { width: 100%; max-width: 640px; margin: 0 auto; }

  .kicker { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; }
  .slide h2 { font-size: clamp(1.4rem, 5.5vw, 1.9rem); margin: 4px 0 12px; }
  .slide p { margin: .5em 0; font-size: 1.04rem; }
  .en { font-weight: 700; color: var(--primary); }
  .hl { background: var(--accent-soft); color: var(--accent); font-weight: 800; padding: 0 4px; border-radius: 5px; }
  ul.ex { list-style: none; padding: 0; margin: 12px 0; display: flex; flex-direction: column; gap: 7px; }
  ul.ex li { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 10px; padding: 8px 12px; font-size: 1.02rem; }
  ul.ex li .t { display: block; color: var(--muted); font-size: .88rem; font-style: italic; margin-top: 1px; }
  .tip { background: var(--primary-soft); color: var(--primary); border-radius: 12px; padding: 10px 14px; margin: 14px 0 2px; font-size: .96rem; font-weight: 600; }
  .tip.warn { background: var(--accent-soft); color: var(--accent); }
  ul.bul { margin: 10px 0; padding-left: 1.1em; }
  ul.bul li { margin: .35em 0; }
  .table-wrap { overflow-x: auto; margin: 12px 0; }
  table.grx { width: 100%; border-collapse: collapse; font-size: .95rem; }
  table.grx th, table.grx td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; }
  table.grx th { background: var(--surface-2); font-family: var(--font-display); font-weight: 700; }

  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .q-kicker { color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; }
  .hint-btn { margin-left: auto; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; font-family: var(--font-body); font-weight: 800; font-size: .85rem; padding: 7px 13px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .hint-btn:hover { border-color: var(--accent); }
  .q-prompt { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.35rem, 5vw, 1.8rem); margin: 0 0 18px; line-height: 1.3; }
  .q-prompt .blank { display: inline-block; min-width: 46px; border-bottom: 3px dashed var(--muted); text-align: center; color: var(--accent); }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt { font: inherit; text-align: left; cursor: pointer; padding: 13px 16px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--fg); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 10px; }
  .opt::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
  .opt:hover { border-color: var(--primary); }
  .opt.sel { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
  .opt.sel::before { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 3px var(--primary-soft); }
  input.fill { font: inherit; font-size: 1.15rem; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--fg); width: 100%; font-weight: 700; }
  input.fill:focus { outline: none; border-color: var(--primary); }
  .q.checked .opt { cursor: default; }
  .q.checked .opt.answer { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .q.checked .opt.answer::before { border-color: var(--good); background: var(--good); box-shadow: none; }
  .q.checked .opt.sel.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .q.checked .opt.sel.wrong::before { border-color: var(--bad); background: var(--bad); box-shadow: none; }
  input.fill.okin { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  input.fill.noin { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .feedback { margin-top: 16px; border-radius: 12px; padding: 12px 15px; font-size: 1rem; }
  .feedback.ok { background: var(--good-soft); color: var(--good); }
  .feedback.no { background: var(--bad-soft); color: var(--bad); }
  .feedback b { font-family: var(--font-display); }
  .feedback .sol { color: var(--fg); }
  .feedback .expl { color: var(--fg); display: block; margin-top: 4px; }

  .res { text-align: center; }
  .res .ring { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 14px; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 2rem; }
  .res h2 { margin: 0 0 6px; }
  .res p { color: var(--muted); margin: 0 auto 4px; max-width: 42ch; }

  .wiz-nav { flex: none; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 11px; padding-bottom: max(11px, env(safe-area-inset-bottom, 0px)); }
  .btn { font: inherit; font-family: var(--font-display); font-weight: 700; cursor: pointer; border-radius: 12px; padding: 12px 18px; border: 2px solid transparent; font-size: 1.02rem; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--primary); }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .wiz-nav .grow { flex: 1; }
  .wiz-nav .btn.wide { min-width: 150px; justify-content: center; }

  .back { background: none; border: 0; color: var(--primary); font-weight: 800; cursor: pointer; padding: 6px 0; font-size: .95rem; font-family: var(--font-body); }
  .topic-head { display: flex; align-items: center; gap: 12px; margin: 6px 0 2px; }
  .topic-head .emoji { font-size: 2rem; }
  .topic-head h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0; }
  .topic-head .t-es { color: var(--muted); font-weight: 600; }
  .summary { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin: 16px 0; flex-wrap: wrap; }
  .summary .ring { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; flex: none; }
  .summary h3 { margin: 0 0 2px; }
  .summary p { margin: 0; color: var(--muted); }
  table.grx.progress td, table.grx.progress th { padding: 10px 12px; vertical-align: middle; }
  table.grx.progress .pemoji { margin-right: 6px; }
  table.grx.progress .muted { color: var(--muted); }
  table.grx.progress tr.pending td { color: var(--muted); }
  .grade { display: inline-block; min-width: 48px; text-align: center; color: #fff; font-family: var(--font-display); font-weight: 800; padding: 3px 8px; border-radius: 999px; font-size: .9rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 26px; }

  .modal-ov { position: fixed; inset: 0; z-index: 50; background: rgba(25,18,10,.55); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px)); animation: ovIn .15s ease; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 460px; max-height: 85%; overflow-y: auto; box-shadow: 0 14px 44px rgba(0,0,0,.3); padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: modIn .2s ease; }
  .modal-head { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
  .modal-head .em { font-size: 1.35rem; }
  .modal-x { margin-left: auto; background: none; border: 0; color: var(--muted); font-size: 1.5rem; line-height: 1; cursor: pointer; padding: 0 4px; }
  .modal-x:hover { color: var(--fg); }
  .modal-body { font-size: 1.05rem; }
  .modal-body p { margin: .4em 0; }
  .modal-body .big { font-family: var(--font-display); font-weight: 700; color: var(--primary); font-size: 1.1rem; }
  .modal .modal-ok { align-self: stretch; }
  @keyframes ovIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes modIn { from { opacity: 0; transform: translateY(12px) scale(.98) } to { opacity: 1; transform: none } }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } .modal-ov, .modal { animation: none !important; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap">

<header class="bar">
  <button class="brand" id="homeBtn" aria-label="Inicio"><span class="logo">A1</span><span>English Trainer</span></button>
  <a class="icon-btn" href="../" title="Otras materias" aria-label="Otras materias">←</a>
  <span class="spacer"></span>
  <button class="icon-btn" id="progressBtn" aria-label="Ver progreso" title="Progreso">📊</button>
  <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema" title="Claro / oscuro">◐</button>
</header>

<main id="app"></main>

<script>
/* =======================================================================
   CONTENIDO — 11 temas de inglés A1+
   slides: {k:kicker, t:título(HTML), h:cuerpo(HTML)}  -> pantallas de explicación
   pool:   banco de 30 preguntas. En cada examen se eligen 15 al azar.
     q:{ t:"mc"|"fill", q:enunciado, o:[opciones], a:respuesta, e:explicación, h:pista }
     (en "fill", a es un array de respuestas válidas)
   ======================================================================= */
const TOPICS = [
  {
    id: "tobe", emoji: "🧍", en: "Verb to be", es: "El verbo ser/estar",
    slides: [
      { k: "Empezamos", t: "¿Qué es el verbo <span class='en'>to be</span>?", h: `
        <p>Es el verbo más importante del inglés. En español equivale a <b>ser</b> y también a <b>estar</b>: un solo verbo para los dos.</p>
        <ul class="ex">
          <li>I <b>am</b> Marta. <span class="t">Yo <b>soy</b> Marta.</span></li>
          <li>I <b>am</b> at home. <span class="t">Yo <b>estoy</b> en casa.</span></li>
          <li>She <b>is</b> happy. <span class="t">Ella <b>está</b> contenta.</span></li>
        </ul>
        <div class="tip">💡 El mismo verbo sirve para decir quién eres, cómo estás y dónde estás.</div>` },
      { k: "Afirmativa", t: "Las formas: am · is · are", h: `
        <p>Cada sujeto usa una forma. Fíjate en las <b>contracciones</b> (la forma corta del día a día):</p>
        <div class="table-wrap"><table class="grx">
          <tr><th>Sujeto</th><th>Forma</th><th>Contracción</th></tr>
          <tr><td>I</td><td>am</td><td>I'm</td></tr>
          <tr><td>You / We / They</td><td>are</td><td>you're · we're · they're</td></tr>
          <tr><td>He / She / It</td><td>is</td><td>he's · she's · it's</td></tr>
        </table></div>` },
      { k: "Negativa y preguntas", t: "Decir NO y preguntar", h: `
        <p><b>Negativa:</b> añadimos <span class="hl">not</span> (normalmente contraído):</p>
        <ul class="ex">
          <li>She <b>isn't</b> here. <span class="t">Ella no está aquí.</span></li>
          <li>They <b>aren't</b> Spanish. <span class="t">No son españoles.</span></li>
        </ul>
        <p><b>Preguntas:</b> el verbo va <b>delante</b> del sujeto:</p>
        <ul class="ex">
          <li><b>Are</b> you ok? — Yes, I <b>am</b>. / No, I'm <b>not</b>.</li>
          <li><b>Is</b> she your sister? — Yes, she <b>is</b>. / No, she <b>isn't</b>.</li>
        </ul>` },
      { k: "Usos", t: "¿Cuándo se usa <span class='en'>to be</span>?", h: `
        <ul class="bul">
          <li><b>Nombre:</b> My name <b>is</b> Marta.</li>
          <li><b>Edad:</b> I <b>am</b> twelve. <span style="color:var(--muted)">(¡no "I have 12"!)</span></li>
          <li><b>Origen:</b> We <b>are</b> from Spain.</li>
          <li><b>Sentimientos:</b> He <b>is</b> happy / tired / hungry.</li>
          <li><b>El tiempo:</b> It <b>is</b> cold today.</li>
        </ul>
        <div class="tip warn">⚠️ La edad y el tiempo se dicen con <b>to be</b>, no con <i>have</i>.</div>` }
    ],
    pool: [
      { t:"fill", q:"I ___ a student.", a:["am","i'm","'m"], e:"Con <b>I</b> siempre usamos <b>am</b>.", h:"Con el sujeto <b>I</b> → <span class='big'>am</span>." },
      { t:"mc", q:"She ___ a doctor.", o:["am","is","are"], a:"is", e:"He/she/it → <b>is</b>.", h:"He, she, it → <span class='big'>is</span>." },
      { t:"mc", q:"They ___ my friends.", o:["is","are"], a:"are", e:"They → <b>are</b>.", h:"You, we, they → <span class='big'>are</span>." },
      { t:"fill", q:"We ___ at school.", a:["are","'re"], e:"We → <b>are</b>.", h:"You, we, they → <span class='big'>are</span>." },
      { t:"mc", q:"___ he your brother?", o:["Am","Is","Are"], a:"Is", e:"Pregunta con he → <b>Is he…?</b>", h:"En preguntas el verbo va delante. Con <b>he</b> → Is." },
      { t:"mc", q:"You ___ very tall.", o:["am","is","are"], a:"are", e:"You → <b>are</b>.", h:"Con <b>you</b> → are." },
      { t:"fill", q:"It ___ a big dog.", a:["is","'s"], e:"It → <b>is</b>.", h:"He, she, it → <span class='big'>is</span>." },

const PICK = 15; // preguntas por examen (de las 30 del banco)

/* =======================================================================
   MOTOR
   ======================================================================= */
const app = document.getElementById("app");
const STORE_KEY = "englishA1_scores";

const WEEK_MS = 7 * 24 * 60 * 60 * 1000; // las notas caducan a la semana
function loadScores() {
  // Devuelve solo las notas NO caducadas (y borra de paso las caducadas).
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
  const out = {}; const now = Date.now(); let changed = false;
  for (const k in raw) {
    let v = raw[k];
    if (typeof v === "number") { v = { last: v, best: v, date: null, ts: 0 }; } // formato antiguo → caducado
    if (typeof v.ts !== "number") v.ts = 0;
    if (now - v.ts > WEEK_MS) { changed = true; continue; }                      // caducada → se descarta
    out[k] = v;
  }
  if (changed) { try { localStorage.setItem(STORE_KEY, JSON.stringify(out)); } catch (e) {} }
  return out;
}
function saveScore(id, pct) {
  try {
    const s = loadScores();
    const prev = s[id] || { best: 0 };
    s[id] = { last: pct, best: Math.max(pct, prev.best || 0), date: new Date().toISOString().slice(0, 10), ts: Date.now() };
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  } catch (e) {}
}
function daysLeft(rec) {
  const ms = WEEK_MS - (Date.now() - (rec.ts || 0));
  return Math.max(0, Math.ceil(ms / (24 * 60 * 60 * 1000)));
}
function caducaTxt(rec) { const d = daysLeft(rec); return d <= 1 ? "caduca hoy" : "caduca en " + d + " días"; }
function resetScores() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function norm(s) {
  return (s || "").toString().toLowerCase().trim().replace(/[‘’]/g, "'").replace(/\s+/g, " ").replace(/[.?!]+$/, "");
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function gradeColor(p) { return p === 100 ? "var(--good)" : p >= 60 ? "var(--accent)" : "var(--bad)"; }

/* ---------- HOME ---------- */
function renderHome() {
  const scores = loadScores();
  function cardHtml(t) {
    const rec = scores[t.id];
    const badge = rec
      ? `<span class="pill done">✓ Hecha · ${rec.last}%</span><span class="pill">${caducaTxt(rec)}</span>`
      : `<span class="pill n">Examen de ${PICK}</span>`;
    return `<button class="card" data-id="${t.id}">
      <span class="emoji">${t.emoji}</span>
      <span class="t-en">${esc(t.en)}</span>
      <span class="t-es">${esc(t.es)}</span>
      <span class="foot">${badge}</span>
    </button>`;
  }
  // Pendientes (sin hacer o caducadas) primero; hechas al final, las que caducan antes arriba.
  const pend = TOPICS.filter(t => !scores[t.id]);
  const done = TOPICS.filter(t => scores[t.id]).sort((a, b) => daysLeft(scores[a.id]) - daysLeft(scores[b.id]));

  let body;
  if (pend.length && done.length) {
    body = `
      <h2 class="mural-h">📌 Por practicar <span class="count">${pend.length}</span></h2>

      <div class="grid">${done.map(cardHtml).join("")}</div>`;
  } else {
    body = `<div class="grid">${pend.concat(done).map(cardHtml).join("")}</div>`;
  }

  app.innerHTML = `<div class="scroll"><div class="wrap">
    <section class="hero">
      <div class="eyebrow">Inglés · Nivel A1+</div>
      <h1>Aprende y practica, paso a paso</h1>
      <p>Elige un tema. Primero te lo explico pantalla a pantalla y luego haces un examen de ${PICK} preguntas (elegidas al azar entre 30, así nunca son las mismas). Te corrige al instante y, si te atascas, tienes el botón 💡 de pista.</p>
    </section>
    ${body}
    <footer>Hecho con cariño para estudiar · ${TOPICS.length} temas · banco de 30 preguntas por tema</footer>
  </div></div>`;
  app.querySelectorAll(".card").forEach(c => c.addEventListener("click", () => { location.hash = c.dataset.id; }));
}

/* ---------- WIZARD ---------- */
let wiz = null; // { topic, index, questions:[...], answers:{qi:{given,ok}} }

function startTopic(id) {
  const topic = TOPICS.find(x => x.id === id);
  if (!topic) { location.hash = ""; return; }
  const questions = shuffle(topic.pool).slice(0, Math.min(PICK, topic.pool.length));
  wiz = { topic, index: 0, questions, answers: {} };
  app.innerHTML = `<div class="wizard">
    <div class="wiz-top">
      <div class="row">
        <button class="wiz-close" id="wizClose" aria-label="Cerrar">×</button>
        <div class="wiz-title"><span class="em">${topic.emoji}</span><span class="txt">${esc(topic.en)}</span></div>
        <div class="wiz-step" id="wizStep"></div>
      </div>
      <div class="pbar"><i id="pbar"></i></div>
    </div>
    <div class="slide-area" id="slideArea"></div>
    <div class="wiz-nav" id="wizNav"></div>
  </div>`;
  document.getElementById("wizClose").addEventListener("click", () => { location.hash = ""; });
  renderSlide();
}

function totalSlides() { return wiz.topic.slides.length + wiz.questions.length + 1; }

function renderSlide() {
  const topic = wiz.topic;
  const nSlides = topic.slides.length;
  const nQ = wiz.questions.length;
  const total = totalSlides();
  const i = wiz.index;
  const area = document.getElementById("slideArea");
  const nav = document.getElementById("wizNav");

  document.getElementById("wizStep").textContent = (i + 1) + " / " + total;
  document.getElementById("pbar").style.width = ((i + 1) / total * 100) + "%";

  // teach slide
  if (i < nSlides) {
    const s = topic.slides[i];
    area.innerHTML = `<div class="slide-wrap"><div class="slide">
      <div class="kicker">${esc(s.k)}</div><h2>${s.t}</h2>${s.h}
    </div></div>`;
    nav.innerHTML = `
      <button class="btn ghost" id="prevBtn" ${i === 0 ? "disabled" : ""}>← Atrás</button>
      <span class="grow"></span>
      <button class="btn primary wide" id="nextBtn">${i === nSlides - 1 ? "Empezar examen →" : "Siguiente →"}</button>`;
    document.getElementById("prevBtn").onclick = goPrev;
    document.getElementById("nextBtn").onclick = goNext;
    area.scrollTop = 0;
    return;
  }

  // result slide
  if (i >= nSlides + nQ) { renderResult(area, nav); return; }

  // question slide
  const qi = i - nSlides;
  const q = wiz.questions[qi];
  const ans = wiz.answers[qi];
  const checked = !!ans;
  const promptHtml = esc(q.q).replace("___", '<span class="blank">?</span>');

  let control;
  if (q.t === "mc") {
    control = `<div class="opts">` + q.o.map(o => {
      const isAns = norm(o) === norm(q.a);
      const isSel = checked && norm(o) === norm(ans.given);
      let cls = "opt";
      if (!checked && isSel) cls += " sel";
      if (checked && isAns) cls += " answer";
      if (checked && isSel && !ans.ok) cls += " sel wrong";
      return `<button class="${cls}" data-val="${esc(o)}" ${checked ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
  } else {
    const val = checked ? esc(ans.given) : "";
    const cls = checked ? (ans.ok ? "okin" : "noin") : "";
    control = `<input class="fill ${cls}" id="fillInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="escribe la respuesta…" value="${val}" ${checked ? "readonly" : ""}>`;
  }

  let feedback = "";
  if (checked) {
    const sol = Array.isArray(q.a) ? q.a[0] : q.a;
    feedback = ans.ok
      ? `<div class="feedback ok"><b>¡Correcto! ✓</b><span class="expl">${q.e}</span></div>`
      : `<div class="feedback no"><b>Casi… ✗</b> Respuesta correcta: <span class="sol">${esc(sol)}</span>.<span class="expl">${q.e}</span></div>`;
  }

  area.innerHTML = `<div class="slide-wrap"><div class="slide q ${checked ? "checked" : ""}">
    <div class="q-head">
      <div class="q-kicker">Pregunta ${qi + 1} de ${nQ}</div>
      <button class="hint-btn" id="hintBtn">💡 Pista</button>
    </div>
    <div class="q-prompt">${promptHtml}</div>
    ${control}
    ${feedback}
  </div></div>`;
  area.scrollTop = 0;

  if (!checked) {
    if (q.t === "mc") {
      area.querySelectorAll(".opt").forEach(opt => opt.addEventListener("click", () => {
        area.querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
        opt.classList.add("sel");
      }));
    } else {
      const inp = document.getElementById("fillInput");
      inp.focus();
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); checkCurrent(); } });
    }
  }
  document.getElementById("hintBtn").onclick = () => openHint(qi);

  nav.innerHTML = `
    <button class="btn ghost" id="prevBtn">← Atrás</button>
    <span class="grow"></span>
    ${checked
      ? `<button class="btn primary wide" id="nextBtn">${i === nSlides + nQ - 1 ? "Ver resultado →" : "Siguiente →"}</button>`
      : `<button class="btn accent wide" id="checkBtn">Comprobar</button>`}`;
  document.getElementById("prevBtn").onclick = goPrev;
  if (checked) document.getElementById("nextBtn").onclick = goNext;
  else document.getElementById("checkBtn").onclick = checkCurrent;
}

function checkCurrent() {
  const topic = wiz.topic;
  const qi = wiz.index - topic.slides.length;
  const q = wiz.questions[qi];
  let given = "", ok = false;
  if (q.t === "mc") {
    const sel = document.querySelector(".opt.sel");
    if (!sel) return; // obliga a elegir
    given = sel.dataset.val;
    ok = norm(given) === norm(q.a);
  } else {
    const inp = document.getElementById("fillInput");
    given = inp.value;
    const valid = Array.isArray(q.a) ? q.a : [q.a];
    ok = given.trim() !== "" && valid.some(a => norm(a) === norm(given));
  }
  wiz.answers[qi] = { given, ok };
  renderSlide();
}

function renderResult(area, nav) {
  const topic = wiz.topic;
  const nQ = wiz.questions.length;
  let correct = 0;
  for (let k = 0; k < nQ; k++) if (wiz.answers[k] && wiz.answers[k].ok) correct++;
  const pct = Math.round(correct / nQ * 100);
  saveScore(topic.id, pct);

  const msg = pct === 100 ? "¡Perfecto! Dominas este tema. 🎉"
    : pct >= 60 ? "¡Muy bien! Repasa los fallos y vuelve a intentarlo."
    : "Vuelve a leer la explicación y reinténtalo. ¡Tú puedes! 💪";

  area.innerHTML = `<div class="slide-wrap"><div class="slide res">
    <div class="ring" style="background:${gradeColor(pct)}">${pct}%</div>
    <h2>${correct} de ${nQ} correctas</h2>
    <p>${msg}</p>
  </div></div>`;
  area.scrollTop = 0;

  nav.innerHTML = `
    <button class="btn accent wide" id="retryBtn">↻ Repetir (otras preguntas)</button>
    <span class="grow"></span>
    <button class="btn primary wide" id="exitBtn">Salir al índice</button>`;
  document.getElementById("retryBtn").onclick = () => startTopic(topic.id);
  document.getElementById("exitBtn").onclick = () => { location.hash = ""; };
}

function goNext() { if (wiz.index < totalSlides() - 1) { wiz.index++; renderSlide(); } }
function goPrev() { if (wiz.index > 0) { wiz.index--; renderSlide(); } }

/* ---------- PISTA (ventana contextual) ---------- */
function openHint(qi) {
  const topic = wiz.topic;
  const q = wiz.questions[qi];
  const hint = q.h || "Repasa la explicación del tema.";
  const ov = document.createElement("div");
  ov.className = "modal-ov";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Pista">
    <div class="modal-head"><span class="em">${topic.emoji}</span><span>Pista</span>
      <button class="modal-x" aria-label="Cerrar">×</button></div>
    <div class="modal-body">${hint}</div>
    <button class="btn primary modal-ok">¡Entendido!</button>
  </div>`;
  document.body.appendChild(ov);
  function close() { ov.remove(); document.removeEventListener("keydown", onEsc); }
  function onEsc(e) { if (e.key === "Escape") close(); }
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  ov.querySelector(".modal-x").onclick = close;
  ov.querySelector(".modal-ok").onclick = close;
  document.addEventListener("keydown", onEsc);
}

/* ---------- PROGRESO ---------- */
function renderProgress() {
  const scores = loadScores();
  const done = TOPICS.filter(t => scores[t.id]);
  const avg = done.length ? Math.round(done.reduce((a, t) => a + scores[t.id].last, 0) / done.length) : null;
  const rows = TOPICS.map(t => {
    const rec = scores[t.id];
    if (!rec) return `<tr class="pending"><td><span class="pemoji">${t.emoji}</span> ${esc(t.en)}</td><td colspan="3" class="muted">Sin hacer todavía</td></tr>`;
    return `<tr>
      <td><span class="pemoji">${t.emoji}</span> ${esc(t.en)}</td>
      <td><span class="grade" style="background:${gradeColor(rec.last)}">${rec.last}%</span></td>
      <td class="muted">${rec.best}%</td>
      <td class="muted">${rec.date ? esc(rec.date) : "—"}<br><span style="font-size:.8em">${caducaTxt(rec)}</span></td>
    </tr>`;
  }).join("");

  app.innerHTML = `<div class="scroll"><div class="wrap">
    <button class="back" id="backBtn">← Todos los temas</button>
    <div class="topic-head"><span class="emoji">📊</span><div><h1>Mi progreso</h1><div class="t-es">Última nota de cada prueba</div></div></div>
    <div class="summary">
      <div class="ring" style="background:${avg === null ? 'var(--muted)' : gradeColor(avg)}">${avg === null ? '—' : avg + '%'}</div>
      <div><h3>${done.length} de ${TOPICS.length} temas practicados</h3><p>${avg === null ? 'Aún no hay notas. ¡Empieza por cualquier tema!' : 'Media de las últimas notas.'}</p></div>
    </div>
    <div class="table-wrap"><table class="grx progress">
      <tr><th>Tema</th><th>Última</th><th>Mejor</th><th>Fecha</th></tr>${rows}
    </table></div>
    <div class="actions">
      <button class="btn primary" id="backBtn2">← Volver a los temas</button>
      <button class="btn ghost" id="resetBtn">Borrar progreso</button>
    </div>
    <footer>Las notas se guardan en este navegador y <b>caducan a los 7 días</b>: después hay que volver a hacer el tema.</footer>
  </div></div>`;

  document.getElementById("backBtn").onclick = () => { location.hash = ""; };
  document.getElementById("backBtn2").onclick = () => { location.hash = ""; };
  document.getElementById("resetBtn").addEventListener("click", function () {
    if (this.dataset.armed === "1") { resetScores(); renderProgress(); }
    else { this.dataset.armed = "1"; this.textContent = "¿Seguro? Pulsa otra vez"; }
  });
}

/* ---------- router + tema ---------- */
function route() {
  const id = (location.hash || "").replace(/^#/, "");
  if (id === "progreso") renderProgress();
  else if (id && TOPICS.some(t => t.id === id)) startTopic(id);
  else renderHome();
}
window.addEventListener("hashchange", route);
document.getElementById("homeBtn").addEventListener("click", () => { location.hash = ""; });
document.getElementById("progressBtn").addEventListener("click", () => { location.hash = "progreso"; });

(function themeInit() {
  const btn = document.getElementById("themeBtn");
  let saved = null;
  try { saved = localStorage.getItem("englishA1_theme"); } catch (e) {}
  if (saved) document.documentElement.setAttribute("data-theme", saved);
  btn.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur === "dark" || (!cur && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("englishA1_theme", next); } catch (e) {}
  });
})();

route();
</script>
